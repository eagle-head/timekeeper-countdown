<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timekeeper Countdown - Vanilla JS Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .time-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .controls {
            margin: 20px 0;
        }
        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .state {
            font-size: 1.2rem;
            margin: 15px 0;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            display: inline-block;
        }
        .logs {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry {
            font-size: 12px;
            margin: 5px 0;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏳ Timekeeper Countdown</h1>
        <p>Vanilla JavaScript Example</p>
        
        <div class="time-display" id="timeDisplay">05:00</div>
        <div class="state" id="stateDisplay">IDLE</div>
        
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resumeBtn">Resume</button>
            <button id="resetBtn">Reset</button>
            <button id="restartBtn">Restart</button>
        </div>
        
        <div class="controls">
            <button id="reset1MinBtn">Reset to 1 min</button>
            <button id="reset5MinBtn">Reset to 5 min</button>
            <button id="reset10MinBtn">Reset to 10 min</button>
        </div>
        
        <div class="logs" id="logs">
            <div class="log-entry">Ready to start countdown...</div>
        </div>
    </div>

    <script type="module">
        // Import the TimekeeperCountdown class
        // In a real app, you would import from npm package
        import { TimekeeperCountdown } from '../../dist/index.js'

        // DOM elements
        const timeDisplay = document.getElementById('timeDisplay')
        const stateDisplay = document.getElementById('stateDisplay')
        const logs = document.getElementById('logs')
        const startBtn = document.getElementById('startBtn')
        const pauseBtn = document.getElementById('pauseBtn')
        const resumeBtn = document.getElementById('resumeBtn')
        const resetBtn = document.getElementById('resetBtn')
        const restartBtn = document.getElementById('restartBtn')
        const reset1MinBtn = document.getElementById('reset1MinBtn')
        const reset5MinBtn = document.getElementById('reset5MinBtn')
        const reset10MinBtn = document.getElementById('reset10MinBtn')

        // Helper functions
        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60)
            const seconds = totalSeconds % 60
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`
        }

        function addLog(message) {
            const logEntry = document.createElement('div')
            logEntry.className = 'log-entry'
            logEntry.textContent = `${new Date().toLocaleTimeString()}: ${message}`
            logs.appendChild(logEntry)
            logs.scrollTop = logs.scrollHeight
        }

        function updateDisplay(data) {
            timeDisplay.textContent = formatTime(data.totalSeconds)
            stateDisplay.textContent = data.state
            updateButtons(data.state)
        }

        function updateButtons(state) {
            startBtn.disabled = state === 'RUNNING'
            pauseBtn.disabled = state !== 'RUNNING'
            resumeBtn.disabled = state !== 'PAUSED'
            resetBtn.disabled = state === 'RUNNING'
            restartBtn.disabled = state === 'IDLE'
            reset1MinBtn.disabled = state === 'RUNNING'
            reset5MinBtn.disabled = state === 'RUNNING'
            reset10MinBtn.disabled = state === 'RUNNING'
        }

        // Create countdown instance
        const countdown = new TimekeeperCountdown(300, { // 5 minutes
            onTick(data) {
                updateDisplay(data)
                if (data.totalSeconds <= 10) {
                    addLog(`⚠️ Only ${data.totalSeconds} seconds left!`)
                }
            },
            onStart(data) {
                updateDisplay(data)
                addLog('🚀 Countdown started!')
            },
            onPause(data) {
                updateDisplay(data)
                addLog('⏸️ Countdown paused')
            },
            onResume(data) {
                updateDisplay(data)
                addLog('▶️ Countdown resumed')
            },
            onReset(data) {
                updateDisplay(data)
                addLog(`🔄 Countdown reset to ${formatTime(data.totalSeconds)}`)
            },
            onRestart(data) {
                updateDisplay(data)
                addLog(`🔄 Countdown restarted with ${formatTime(data.totalSeconds)}`)
            },
            onComplete(data) {
                updateDisplay(data)
                addLog('🎉 Countdown completed!')
                alert('Time\'s up! 🎉')
            }
        })

        // Initialize display
        updateDisplay({
            totalSeconds: countdown.totalSeconds,
            state: countdown.state
        })

        // Event listeners
        startBtn.addEventListener('click', () => countdown.start())
        pauseBtn.addEventListener('click', () => countdown.pause())
        resumeBtn.addEventListener('click', () => countdown.resume())
        resetBtn.addEventListener('click', () => countdown.reset())
        restartBtn.addEventListener('click', () => countdown.restart())
        reset1MinBtn.addEventListener('click', () => countdown.reset(60))
        reset5MinBtn.addEventListener('click', () => countdown.reset(300))
        reset10MinBtn.addEventListener('click', () => countdown.reset(600))

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            countdown.destroy()
        })
    </script>
</body>
</html>
