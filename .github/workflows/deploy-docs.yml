name: Deploy Docs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

# Least privilege at the workflow level: nothing is granted globally.
# Each job opts into only the scopes it needs (see per-job `permissions`).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The build job runs `npm ci` + `npm run docs:build`, executing lifecycle
    # scripts from the checked-out tree. It must therefore ONLY ever run on
    # trusted, push-originated code from this repository — never on a
    # workflow_run triggered by a fork's pull_request (pwn-request vector).
    # workflow_dispatch is manual and inherently trusted.
    # The build job needs no write scopes; it only reads source and uploads
    # an artifact (covered by the default GITHUB_TOKEN within the same repo).
    permissions:
      contents: read
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    # Privileged scopes live ONLY on the deploy job, which runs no untrusted
    # code — it just publishes the artifact produced by the gated build job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
